<html lang="vi" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MindX Cinema — Đăng ký</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg bg-dark border-bottom border-secondary sticky-top">
  <div class="container">
    <a class="navbar-brand fw-bold" href="index.html"><span class="text-danger">MindX</span> Cinema</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu_chinh" aria-label="Mở menu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="menu_chinh">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="tim_kiem.html">Tìm kiếm</a></li>
        <li class="nav-item"><a class="nav-link" href="tin_tuc.html">Tin tức</a></li>
      </ul>
      <ul class="navbar-nav align-items-lg-center" id="khu_vuc_tai_khoan">
        <li class="nav-item"><a class="nav-link" href="dang_nhap.html">Đăng nhập</a></li>
      </ul>
    </div>
  </div>
</nav>

<main class="container">
  <form id="form_dang_ky" class="khung-form" novalidate>
    <h1 class="h3 mb-1">Tạo tài khoản</h1>
    <p class="text-secondary mb-4">Miễn phí, chỉ mất 30 giây.</p>

    <div id="thong_bao" class="alert d-none" role="alert"></div>

    <div class="mb-3">
      <label for="ho_ten" class="form-label">Họ và tên</label>
      <input type="text" class="form-control" id="ho_ten" placeholder="Nguyễn Văn A">
      <div class="invalid-feedback"></div>
    </div>
    <div class="mb-3">
      <label for="email" class="form-label">Email</label>
      <input type="email" class="form-control" id="email" placeholder="em@example.com">
      <div class="invalid-feedback"></div>
    </div>
    <div class="mb-3">
      <label for="ten_dang_nhap" class="form-label">Tên đăng nhập</label>
      <input type="text" class="form-control" id="ten_dang_nhap" placeholder="vana2011">
      <div class="invalid-feedback"></div>
    </div>
    <div class="mb-3">
      <label for="mat_khau" class="form-label">Mật khẩu</label>
      <input type="password" class="form-control" id="mat_khau">
      <div class="invalid-feedback"></div>
    </div>
    <div class="mb-4">
      <label for="xac_nhan_mat_khau" class="form-label">Nhập lại mật khẩu</label>
      <input type="password" class="form-control" id="xac_nhan_mat_khau">
      <div class="invalid-feedback"></div>
    </div>

    <button type="submit" class="btn btn-danger w-100">Đăng ký</button>
    <p class="text-center text-secondary mt-3 mb-0">Đã có tài khoản? <a href="dang_nhap.html">Đăng nhập</a></p>
  </form>
</main>

<footer class="py-4 text-center">
  <div class="container">MindX Cinema · Dự án học tập khóa Web Developer Advanced · Dữ liệu phim từ TMDB</div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/validate.js"></script>
<script src="js/auth.js"></script>
<script src="js/chatbot.js"></script>
</body>
</html>
